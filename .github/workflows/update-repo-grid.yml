name: Refresh profile dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"  # daily
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "assets/**"
      - ".github/scripts/**"
      - ".github/workflows/update-repo-grid.yml"

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh repository cards and contribution city
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python .github/scripts/refresh_profile.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh profile dashboard and contribution city"
            git push
          fi
