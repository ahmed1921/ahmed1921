<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="466" viewBox="0 0 1280 466" role="img" aria-label="Unity and C# toolkit: gameplay, XR, performance, networking, workflow and AI"><title>Unity and C# toolkit: gameplay, XR, performance, networking, workflow and AI</title><defs>
      <linearGradient id="accent"><stop stop-color="#35d7ed"/><stop offset=".55" stop-color="#b695ff"/><stop offset="1" stop-color="#fa8dc4"/></linearGradient>
      <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#18213a"/><stop offset="1" stop-color="#0c0f1c"/></linearGradient>
      <radialGradient id="halo"><stop stop-color="#614aa0" stop-opacity=".25"/><stop offset="1" stop-color="#614aa0" stop-opacity="0"/></radialGradient>
      <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#56617c" opacity=".16"/></pattern>
    </defs>
    <style>
      .float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .sway{animation:sway 7s ease-in-out infinite;transform-origin:210px 0px}
      .pulse{animation:pulse 3s ease-in-out infinite}
      .orbit{animation:orbit 22s linear infinite;transform-box:fill-box;transform-origin:center}
      .trace{stroke-dasharray:14 12;animation:trace 7s linear infinite}
      .sweep{animation:sweep 5s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
      @keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.38}}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @keyframes trace{to{stroke-dashoffset:-260}}
      @keyframes sweep{0%,100%{opacity:.35}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
