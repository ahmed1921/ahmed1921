<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="394" viewBox="0 0 1280 394" role="img" aria-label="Gameplay engineering and an iterative approach from prototype to production"><title>Gameplay engineering and an iterative approach from prototype to production</title><defs>
      <linearGradient id="accent"><stop stop-color="#35d7ed"/><stop offset=".55" stop-color="#b695ff"/><stop offset="1" stop-color="#fa8dc4"/></linearGradient>
      <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#18213a"/><stop offset="1" stop-color="#0c0f1c"/></linearGradient>
      <radialGradient id="halo"><stop stop-color="#614aa0" stop-opacity=".25"/><stop offset="1" stop-color="#614aa0" stop-opacity="0"/></radialGradient>
      <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#56617c" opacity=".16"/></pattern>
    </defs>
    <style>
      .float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .sway{animation:sway 7s ease-in-out infinite;transform-origin:210px 0px}
      .pulse{animation:pulse 3s ease-in-out infinite}
      .orbit{animation:orbit 22s linear infinite;transform-box:fill-box;transform-origin:center}
      .trace{stroke-dasharray:14 12;animation:trace 7s linear infinite}
      .sweep{animation:sweep 5s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
      @keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.38}}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @keyframes trace{to{stroke-dashoffset:-260}}
      @keyframes sweep{0%,100%{opacity:.35}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style><rect x="1" y="1" width="1278" height="392" rx="26" fill="#0c0f1c" stroke="#2a324c" /><rect x="2" y="2" width="1276" height="390" rx="25" fill="url(#dots)"/><text x="42" y="54" fill="#35d7ed" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="600" >01 / WHAT I BUILD</text><text x="42" y="96" fill="#eef0fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" >Gameplay worth coming back to.</text><rect x="42" y="123" width="578" height="156" rx="14" fill="#141c31" stroke="#2a324c" /><text x="63" y="151" fill="#a4aec7" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="500" >GAMEPLAY LOOP</text><path d="M65 249H600 M74 216H173V190H272V225H377V174H486V209H583" fill="none" stroke="#465679" stroke-width="2"/><path d="M84 207 Q144 116 216 180 T354 166 T523 144" fill="none" stroke="#35d7ed" stroke-width="3" class="trace"/><circle cx="84" cy="207" r="8" fill="#b695ff" stroke="#eef0fb" stroke-width="2"/><circle cx="216" cy="180" r="8" fill="#b695ff" stroke="#eef0fb" stroke-width="2"/><circle cx="354" cy="166" r="8" fill="#b695ff" stroke="#eef0fb" stroke-width="2"/><circle cx="523" cy="144" r="8" fill="#b695ff" stroke="#eef0fb" stroke-width="2"/><text x="42" y="321" fill="#eef0fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="500" >Combat, core loops, UI, progression and tools.</text><text x="42" y="356" fill="#a4aec7" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" >2D / 3D games, prototypes and live attractions.</text><path d="M640 42V356" stroke="#2a324c"/><text x="682" y="54" fill="#fa8dc4" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="600" >02 / HOW I BUILD</text><text x="682" y="96" fill="#eef0fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" >From prototype to production.</text><rect x="682" y="123" width="555" height="156" rx="14" fill="#141c31" stroke="#2a324c" /><rect x="716" y="152" width="143" height="95" rx="12" fill="#1e2740" stroke="#35d7ed" /><text x="732" y="182" fill="#35d7ed" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="600" >PROTOTYPE</text><text x="732" y="222" fill="#a4aec7" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" >Find the fun</text><rect x="893" y="152" width="143" height="95" rx="12" fill="#1e2740" stroke="#b695ff" /><text x="909" y="182" fill="#b695ff" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="600" >ITERATE</text><text x="909" y="222" fill="#a4aec7" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" >Refine the feel</text><rect x="1070" y="152" width="143" height="95" rx="12" fill="#1e2740" stroke="#fa8dc4" /><text x="1086" y="182" fill="#fa8dc4" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="600" >SHIP</text><text x="1086" y="222" fill="#a4aec7" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" >Target the device</text><path d="M863 200H886 M1040 200H1063" stroke="#35d7ed" stroke-width="2" class="pulse"/><text x="682" y="321" fill="#eef0fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="500" >Reusable systems. Clear milestones. Early builds.</text><text x="682" y="356" fill="#a4aec7" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" >AR / VR, connected screens and device optimization.</text></svg>
