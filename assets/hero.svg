<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="494" viewBox="0 0 1280 494" role="img" aria-label="Ahmed Danish — Senior Unity Developer, 9+ years building games and XR experiences"><title>Ahmed Danish — Senior Unity Developer, 9+ years building games and XR experiences</title><defs>
