<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="525" viewBox="0 0 1280 525" role="img" aria-label="Ahmed Danish developer ID and professional dashboard with Unity and XR project experience"><title>Ahmed Danish developer ID and professional dashboard with Unity and XR project experience</title><defs>
      <linearGradient id="accent"><stop stop-color="#35d7ed"/><stop offset=".55" stop-color="#b695ff"/><stop offset="1" stop-color="#fa8dc4"/></linearGradient>
      <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#18213a"/><stop offset="1" stop-color="#0c0f1c"/></linearGradient>
