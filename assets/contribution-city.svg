<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 230" width="1280" height="230" role="img" aria-label="GitHub contribution city: waiting for the first automatic refresh">
    <title>GitHub contribution city: waiting for the first automatic refresh</title>
    <defs><linearGradient id="a"><stop stop-color="#35d7ed"/><stop offset="1" stop-color="#b695ff"/></linearGradient></defs>
    <style>.signal{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
    <rect x="1" y="1" width="1278" height="228" rx="22" fill="#0c0f1c" stroke="#2a324c"/><text x="40" y="65" fill="#35d7ed" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="600">CONTRIBUTION CITY</text><text x="40" y="132" fill="#eef0fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="700">Loading my GitHub activity.</text><text x="40" y="183" fill="#a4aec7" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400">The first automatic refresh will build this city from real contributions.</text></svg>
