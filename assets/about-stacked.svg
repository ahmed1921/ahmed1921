<svg xmlns="http://www.w3.org/2000/svg" width="640" height="810" viewBox="0 0 640 810" role="img" aria-label="Animated gameplay character and developer at work, in two vertically stacked cards">
<title>Gameplay worth coming back to. From prototype to production.</title>
<defs>
      <linearGradient id="accent"><stop stop-color="#35d7ed"/><stop offset=".55" stop-color="#b695ff"/><stop offset="1" stop-color="#fa8dc4"/></linearGradient>
      <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#18213a"/><stop offset="1" stop-color="#0c0f1c"/></linearGradient>
      <radialGradient id="halo"><stop stop-color="#614aa0" stop-opacity=".25"/><stop offset="1" stop-color="#614aa0" stop-opacity="0"/></radialGradient>
      <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#56617c" opacity=".16"/></pattern>
    
<linearGradient id="character-shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#334c67"/><stop offset="1" stop-color="#192c45"/></linearGradient>
<linearGradient id="character-screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#153f53"/><stop offset="1" stop-color="#111d34"/></linearGradient>
<g id="developer-head">
  <ellipse cx="-18" cy="7" rx="3.5" ry="5" fill="#bf886c"/>
  <ellipse cx="18" cy="7" rx="3.5" ry="5" fill="#bf886c"/>
  <rect x="-17" y="-21" width="34" height="44" rx="15" fill="#d9a284"/>
  <path d="M-17 10Q-15 22 0 24Q15 22 17 10L13 13Q8 20 0 19Q-8 20-13 13Z" fill="#3b3033"/>
  <path d="M-17 1L-18-10Q-22-27-8-28Q7-35 19-22Q23-12 17 1L14-10Q8-8 4-17Q-2-8-14-12Z" fill="#262733"/>
  <path d="M-14-18Q-4-30 12-22" fill="none" stroke="#464553" stroke-width="2" stroke-linecap="round"/>
  <path d="M-11-2L-5-3M5-3L11-2" stroke="#49322e" stroke-width="1.6" stroke-linecap="round"/>
  <g class="character-eyes"><ellipse cx="-8" cy="4" rx="2.2" ry="2.5" fill="#202333"/><ellipse cx="8" cy="4" rx="2.2" ry="2.5" fill="#202333"/><circle cx="-7.4" cy="3.4" r=".65" fill="#fff1df"/><circle cx="8.6" cy="3.4" r=".65" fill="#fff1df"/></g>
  <path d="M0 6L-1 10L2 10" fill="none" stroke="#b57e67" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M-4 14Q0 16 4 14" fill="none" stroke="#ecbba0" stroke-width="1.2" stroke-linecap="round"/>
</g>
</defs>
<style>
      .float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .sway{animation:sway 7s ease-in-out infinite;transform-origin:210px 0px}
      .pulse{animation:pulse 3s ease-in-out infinite}
      .orbit{animation:orbit 22s linear infinite;transform-box:fill-box;transform-origin:center}
      .trace{stroke-dasharray:14 12;animation:trace 7s linear infinite}
      .sweep{animation:sweep 5s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
      @keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.38}}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @keyframes trace{to{stroke-dashoffset:-260}}
      @keyframes sweep{0%,100%{opacity:.35}50%{opacity:1}}

      .character-eyes{animation:character-blink 5.6s linear infinite;transform-box:fill-box;transform-origin:center}
      .game-travel{animation:game-travel 12s ease-in-out infinite}
      .game-breathe{animation:game-breathe 1.4s ease-in-out infinite}
      .stride-left{animation:stride-left .7s ease-in-out infinite;transform-origin:-7px -19px}
      .stride-right{animation:stride-right .7s ease-in-out infinite;transform-origin:7px -19px}
      .typing-left{animation:typing-left 1.15s ease-in-out infinite;transform-origin:-5px -37px}
      .typing-right{animation:typing-right 1.15s ease-in-out infinite;transform-origin:-15px -36px}
      .screen-cursor{animation:screen-cursor 1.2s step-end infinite}
      .workflow-beacon{animation:workflow-beacon 4.8s ease-in-out infinite}
      .workflow-beacon-2{animation-delay:1.6s}
      .workflow-beacon-3{animation-delay:3.2s}
      @keyframes character-blink{0%,41%,45%,100%{transform:scaleY(1)}43%{transform:scaleY(.12)}}
      @keyframes game-travel{0%,8%,100%{transform:translateX(155px)}45%,53%{transform:translateX(493px)}92%{transform:translateX(155px)}}
      @keyframes game-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
      @keyframes stride-left{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
      @keyframes stride-right{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-12deg)}}
      @keyframes typing-left{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
      @keyframes typing-right{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-3deg)}}
      @keyframes screen-cursor{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes workflow-beacon{0%,14%,100%{opacity:.3}28%,42%{opacity:1}}

      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
