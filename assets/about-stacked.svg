      <circle cx="-7" cy="-33" r="3.7" fill="#d9a284"/><circle cx="7" cy="-33" r="3.7" fill="#d9a284"/>
      <path d="M-5-37H5Q10-37 11-29L7-28L3-31H-3L-7-28L-11-29Q-10-37-5-37Z" fill="#10192a" stroke="#7e93ab" stroke-width="1"/>
      <path d="M-6-34V-30M-8-32H-4" stroke="#35d7ed" stroke-width="1.2"/><circle cx="6" cy="-33" r="1.1" fill="#b695ff"/><circle cx="8" cy="-31" r="1" fill="#fa8dc4"/>
      <use href="#developer-head" transform="translate(0 -71) scale(.68)"/>
    </g>
  </g>
</g>
<text x="42" y="321" fill="#eef0fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="500" >Combat, core loops, UI, progression and tools.</text><text x="42" y="356" fill="#a4aec7" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" >2D / 3D games, prototypes and live attractions.</text></g>
<g transform="translate(0 416)"><rect x="1" y="1" width="638" height="392" rx="26" fill="#0c0f1c" stroke="#2a324c"/><rect x="2" y="2" width="636" height="390" rx="25" fill="url(#dots)"/></g>
<g transform="translate(-640 416)"><text x="682" y="54" fill="#fa8dc4" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="600" >02 / HOW I BUILD</text><text x="682" y="96" fill="#eef0fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" >From prototype to production.</text>
